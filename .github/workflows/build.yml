name: Build SystemMonitor

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Compile Server
      shell: cmd
      run: cl /EHsc /Fe:server.exe server.cpp ws2_32.lib
      working-directory: src
    
    - name: Compile Client
      shell: cmd
      run: cl /EHsc /Fe:client.exe client.cpp ws2_32.lib
      working-directory: src
    
    - name: Copy to release
      shell: cmd
      run: |
        mkdir release
        copy src\server.exe release\
        copy src\client.exe release\
    
    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: SystemMonitor-EXE
        path: release/
